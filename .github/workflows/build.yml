name: Build MoonWake Kernel

env:
  OUT_DIR: ${{ github.workspace }}/out

on:
  workflow_dispatch:
    inputs:
      config_type:
        description: Config type
        required: true
        type: choice
        default: release
        options: [release, nightly]
      config_file:
        description: Specific config JSON (blank = all non-deprecated configs)
        required: false
        default: ''
        type: string
      full_dump:
        description: Upload a full dump artifact?
        required: true
        type: choice
        default: 'false'
        options: ['true', 'false']
      send_to_telegram:
        description: Send result to Telegram?
        required: true
        type: choice
        default: 'false'
        options: ['true', 'false']
      release_tag:
        description: Existing release tag to overwrite (blank = mwk-2.7.0-<run_number>)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  Set-repos:
    name: Parse configs
    runs-on: ubuntu-24.04
    outputs:
      repos: ${{ steps.matrix.outputs.repos }}
      buildfile: ${{ steps.matrix.outputs.buildfile }}
      builddate: ${{ steps.date.outputs.builddate }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate matrix
        id: matrix
        env:
          CONFIG_FILE_IN: ${{ github.event.inputs.config_file }}
          CONFIG_TYPE_IN: ${{ github.event.inputs.config_type }}
        run: bash ci/gen-matrix.sh
      - name: Set builddate
        id: date
        run: echo "builddate=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"

  Build-Kernel:
    name: Build kernel
    runs-on: ubuntu-24.04
    needs: [Set-repos]
    strategy:
      max-parallel: 10
      fail-fast: true
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      KERNEL_NAME: ${{ matrix.repos.kernelSource.name }}
      KERNEL_REPO: ${{ matrix.repos.kernelSource.repo }}
      KERNEL_BRANCH: ${{ matrix.repos.kernelSource.branch }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.defconfig }}
      EXTRA_CONFIG_NAME: ${{ matrix.repos.kernelSource.extraConfig }}
      OUTPUT_IMAGE: ${{ matrix.repos.output_image }}
      build_out: ${{ matrix.repos.params.build_out }}
      KSU_VERSION_OVERRIDE: ${{ matrix.repos.params.externalCommand.KSU_VERSION_OVERRIDE }}
      kernelSU: ${{ matrix.repos.kernelsu.enable }}
      kernelSUsetupArg: ${{ matrix.repos.kernelsu.setupArg }}
      ccache: ${{ matrix.repos.ccache }}
      PATHMASK_ENABLE: ${{ matrix.repos.pathmask.enable }}
      useKernelPatch: ${{ matrix.repos.kp.use }}
      kpKpimgLink: ${{ matrix.repos.kp.kpimg_link }}
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libfl-dev aria2 curl device-tree-compiler git libarchive-tools ccache \
            python3 python3-pip zip unzip tar gzip bzip2 rar unrar binwalk libelf-dev \
            checkinstall libncursesw5-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev \
            libbz2-dev libffi-dev

      - name: ccache configure
        if: env.ccache == 'true'
        run: ccache -o compression=false -o cache_dir="$HOME/.ccache"

      - name: ccache cache
        if: env.ccache == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ${{ env.OUT_DIR }}
          key: ccache-${{ env.KERNEL_NAME }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.KERNEL_NAME }}-

      - name: Setup AnyKernel3
        env:
          params: ${{ toJSON(matrix.repos.AnyKernel3) }}
        run: |
          set -euo pipefail
          repo="$(jq -r '.repo' <<< "$params")"
          branch="$(jq -r '.branch // "ruby"' <<< "$params")"
          if [ "$repo" = local ]; then
            cp -a "$GITHUB_WORKSPACE/anykernel3" AnyKernel3
            echo 'AnyKernel3 => vendored'
          else
            git clone --recursive --depth=1 --branch "$branch" "$repo" AnyKernel3
          fi

      - name: Clone kernel source
        run: |
          set -euo pipefail
          git clone --recursive --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_NAME"
          echo "kernel commit: $(git -C "$KERNEL_NAME" rev-parse HEAD)"

      - name: Get toolchains
        env:
          toolchains: ${{ toJSON(matrix.repos.toolchains) }}
        run: bash ci/toolchains.sh

      - name: Set args
        id: args
        env:
          params: ${{ toJSON(matrix.repos.params) }}
        run: bash ci/set-args.sh

      - name: Resolve CI scripts
        env:
          KSU_SETUP_LINK: ${{ matrix.repos.kernelsu.setupLink }}
          ADDITIONAL_LINK: ${{ matrix.repos.additional_script_link }}
          ADDITIONAL_POST_LINK: ${{ matrix.repos.additional_post_script_link }}
        run: bash ci/resolve-scripts.sh

      - name: Verify vendored KernelSU-Next digest
        if: env.kernelSU == 'true'
        run: sh ci/vendor-digest.sh --check

      - name: Integrate Kernel Root implementation
        if: env.kernelSU == 'true'
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          echo '' > .scmversion
          [ -n "${KSU_SETUP_SCRIPT:-}" ] || { echo 'KernelSU setup script unresolved' >&2; exit 1; }
          sh "$KSU_SETUP_SCRIPT" "$kernelSUsetupArg"
          test -L drivers/kernelsu || { echo 'drivers/kernelsu symlink missing' >&2; exit 1; }
          cat "$GITHUB_WORKSPACE/kernelsu/KernelSU-Next/UPSTREAM"
          sed -i 's/ -dirty//g' scripts/setlocalversion

      - name: Run additional script
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${ADDITIONAL_SCRIPT:-}" ]; then echo 'no additional script configured'; exit 0; fi
          sh "$ADDITIONAL_SCRIPT"

      - name: Make defconfig
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.args.outputs.args }}
        run: |
          set -euo pipefail
          make ${{ env.args }} "$DEFCONFIG_NAME"
          for fragment in $EXTRA_CONFIG_NAME; do
            echo "-- appending fragment: $fragment"
            make ${{ env.args }} "$fragment"
          done

      - name: Assert KernelSU integrated
        if: env.kernelSU == 'true'
        run: |
          set -euo pipefail
          test -L "$KERNEL_NAME/drivers/kernelsu"
          cfg="$OUT_DIR/.config"
          grep -q '^CONFIG_KSU=y$' "$cfg" || {
            echo 'CONFIG_KSU was dropped by Kconfig: drivers/kernelsu is not wired in' >&2
            grep -i ksu "$cfg" || true
            exit 1
          }
          grep -q '^CONFIG_KSU_SUSFS' "$cfg" || echo 'warning: no CONFIG_KSU_SUSFS* enabled'

      - name: Build kernel
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.args.outputs.args }}
        run: |
          set -euo pipefail
          set +e
          make ${{ env.args }} "$build_out" V=0 2>&1 | tee /tmp/kernel-build.log | \
            grep --line-buffered --color=always -E \
            'warning:|error:|undefined reference|No rule to make target|KernelSU|SUSFS|LTO|MODPOST|VMLINUX'
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "build failed with status $status" >&2
            tail -n 200 /tmp/kernel-build.log
            exit "$status"
          fi

      - name: Run additional post script
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${ADDITIONAL_POST_SCRIPT:-}" ]; then echo 'no post script configured'; exit 0; fi
          sh "$ADDITIONAL_POST_SCRIPT"

      - name: Build kernel modules for PathMask
        if: env.PATHMASK_ENABLE == 'true'
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.args.outputs.args }}
        run: make ${{ env.args }} modules

      - name: ccache stats
        if: env.ccache == 'true'
        run: ccache -s

      - name: Stage kernel image
        env:
          ARCH: ${{ steps.args.outputs.ARCH }}
        run: bash ci/stage-kernel.sh

      - name: Build PathMask LKM
        if: env.PATHMASK_ENABLE == 'true'
        env:
          args: ${{ steps.args.outputs.args }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/KDJCPM/LKM-PathMask.git pathmask-src
          cat > pathmask-src/kernel/compat_4.19.h <<'EOF'
          #ifndef _PATHMASK_COMPAT_419_H
          #define _PATHMASK_COMPAT_419_H
          #include <linux/ptrace.h>
          #define regs_set_return_value(regs, val) ((regs)->regs[0] = (unsigned long)(val))
          #endif
          EOF
          sed -i '1i #include "compat_4.19.h"' pathmask-src/kernel/pathmask.c pathmask-src/kernel/procguard.c
          cd "$GITHUB_WORKSPACE/$KERNEL_NAME"
          make ${{ env.args }} M="$GITHUB_WORKSPACE/pathmask-src/kernel" modules
          ls -l "$GITHUB_WORKSPACE/pathmask-src/kernel/"*.ko

      - name: Package PathMask KSU module
        if: env.PATHMASK_ENABLE == 'true'
        run: |
          set -euo pipefail
          pkg_name=$(echo "$KERNEL_NAME" | tr '-' '_')
          mkdir -p pathmask-pkg
          cp -a pathmask-src/ksu-module/. pathmask-pkg/
          cp pathmask-src/kernel/pathmask.ko pathmask-pkg/ 2>/dev/null || true
          cp pathmask-src/kernel/procguard.ko pathmask-pkg/ 2>/dev/null || true
          cd pathmask-pkg
          zip -qr "../${pkg_name}_PathMask_ksu.zip" .

      - name: Patch with KernelPatch
        if: env.useKernelPatch == 'true'
        env:
          APATCH_KEY: ${{ secrets.APATCH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p kernel_patch_processing
          cd kernel_patch_processing
          curl -fsSL -o kptools-linux https://github.com/bmax121/KernelPatch/releases/download/0.11.3/kptools-linux
          curl -fsSL -o kpimg-android "$kpKpimgLink"
          chmod +x kptools-linux
          ./kptools-linux -p -s "$APATCH_KEY" -i ../out_kernel/Image -k kpimg-android -o ./oImage
          mv ./oImage ../out_kernel/Image

      - name: Pack AnyKernel3
        run: bash ci/pack-ak3.sh

      - name: Verify build output
        run: bash ci/verify-bundle.sh

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ env.KERNEL_NAME }}-${{ github.run_number }}
          path: verify
          if-no-files-found: warn

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}_ak3
          path: ./AnyKernel3
          if-no-files-found: error

  publish:
    needs: [Set-repos, Build-Kernel]
    runs-on: ubuntu-latest
    if: needs.Build-Kernel.result == 'success'
    permissions:
      contents: write
    env:
      buildfile: ${{ needs.Set-repos.outputs.buildfile }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_kernels

      - name: Pack kernels and select release assets
        run: bash ci/pack-release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('mwk-2.7.0-{0}', github.run_number) }}
          name: "MoonWake 2.7.0 #${{ github.run_number }}"
          files: release_assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            MoonWake kernel build

            - Build type: `${{ github.event.inputs.config_type }}`
            - Configs: `${{ env.buildfile }}`
            - Commit: `${{ github.sha }}`
            - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish full dump
        uses: actions/upload-artifact@v4
        if: github.event.inputs.full_dump == 'true'
        with:
          name: all-kernel-build-dumps
          path: packed_kernels

      - name: Telegram File Uploader
        uses: xz-dev/TelegramFileUploader@v1.1.1
        if: github.event.inputs.send_to_telegram == 'true'
        with:
          to-who: ${{ secrets.TELEGRAM_API_TO_WHO }}
          message: |
            #Nightly #MoonWake

            ⚙️ **Build Information:**
            - **Configs:** `${{ env.buildfile }}`
            - **Build type:** `${{ github.event.inputs.config_type }}`

            📊 **Workflow:**
            - **Attempt:** `${{ github.run_attempt }}`
            - **Run Number:** `#${{ github.run_number }}`
            - **Actor:** `${{ github.actor }}`
            - **Workflow SHA:** `${{ github.sha }}`
            - **Workflow Link:** [click here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            📄 **Notes:**
            - You're RESPONSIBLE for EVERY DAMAGE, if you flash this ${{ github.event.inputs.config_type }} build.
            - [Flash on AOSP](https://github.com/DXRN-MoonWake/moonwake_kernel_xiaomi_ruby/wiki/Flash-MoonWake-on-AOSP)
            - [Flash on HyperOS/MIUI](https://github.com/DXRN-MoonWake/moonwake_kernel_xiaomi_ruby/wiki/Flash-MoonWake-on-MIUI-HyperOS)
          files: ${{ env.KERNEL_BUILD_LIST }}
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
